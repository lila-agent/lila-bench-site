<body data-page="compose" data-mailbox="seller">
<div class="banner">Lila test site for benchmarking. Every name, address and number here is made up; nothing is sent, booked or bought.</div>
<header><strong>Bench Seller Mail</strong><a href="../h30/seller/">Inbox</a><a href="../h30/seller/drafts.html">Drafts</a><a href="../h30/seller/sent.html">Sent</a><a href="../h30/seller/compose.html">Compose</a><a href="../h30/seller/shipping.html">Shipping</a><a href="../h30/seller/policy.html">Store policy</a></header>
<main>
<h1 id="heading">New message</h1>
<form class="card" id="compose" onsubmit="return false">
<label for="to">To</label><input id="to" name="to" autocomplete="off"><label for="subject">Subject</label><input id="subject" name="subject" autocomplete="off">
<label for="body">Message</label><textarea id="body" name="body"></textarea>
<label for="attach">Attach files</label><input id="attach" name="attach" type="file" multiple><ul id="attached"></ul>
<div><button type="button" id="send">Send</button><button type="button" class="plain" id="save">Save draft</button><a class="button plain" href="index.html">Discard</a> <span id="saved" class="muted" role="status"></span></div></form>
<div class="card muted" id="quoted"></div>
</main>

<footer><p id="bench-record" role="note" class="record">Test record for the benchmark's checks.</p><p id="bench-receipt" class="record receipt">Bench receipt: (working it out)</p></footer>
