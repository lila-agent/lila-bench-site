<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bench Support · Delivery request</title>
<link rel="stylesheet" href="../h30.css">
</head>
<body data-page="">
<div class="banner">Lila test site for benchmarking. Every name, address and number here is made up; nothing is sent, booked or bought.</div>
<header><strong>Bench Support</strong><a href="../../h30/support/">Delivery request</a></header>
<main>
<h1>Delivery request</h1><p class="muted">Tell the driver what to do with your parcel.</p>
<form class="card" data-form="support" data-done="done.html"><div class="errors" hidden></div>
<label for="tracking">Tracking number</label><input id="tracking" name="tracking" required data-label="Tracking number" autocomplete="off">
<label for="delivery">Estimated delivery date</label><input id="delivery" name="delivery" type="date" required data-label="Estimated delivery date">
<label for="kind">Request</label><select id="kind" name="kind" required data-label="Request"><option value="">Choose one</option><option>Delivery instructions</option><option>Change the address</option><option>Report a problem</option></select>
<label for="message">Message for the driver</label><textarea id="message" name="message" required data-label="Message"></textarea><div><button type="submit">Send request</button></div></form>
</main>

<footer><p id="bench-record" role="note" class="record">Test record for the benchmark's checks.</p><p id="bench-receipt" class="record receipt">Bench receipt: (working it out)</p></footer>
<script src="../h30.js"></script>
</body>
</html>
