<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bench HR · New starter form</title>
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="hire">
<div class="banner">Lila test site for benchmarking. Every name, address and number here is made up; nothing is sent or bought.</div>
<header><strong>Bench HR</strong><a href="../hire/">New starter form</a></header>
<main>
<h1>New starter form</h1><p class="muted">Fill this in for each person joining. All fields are needed.</p>
<form class="card" id="hire-form">
<label for="name">Full name</label><input id="name" name="name" autocomplete="off">
<label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="off">
<label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="off">
<label for="department">Department</label><select id="department" name="department"><option value="">Choose a department</option><option>Engineering</option><option>Finance</option><option>Marketing</option><option>Operations</option><option>Sales</option></select>
<label for="start">Start date</label><input id="start" name="start" type="date">
<div class="row" style="margin-top:12px"><input id="laptop" name="laptop" type="checkbox"><label for="laptop" style="margin:0">Needs a laptop</label></div>
<label for="manager">Manager</label><input id="manager" name="manager" autocomplete="off">
<div><button type="submit">Submit</button></div></form>
</main>
<footer><p id="bench-record" role="note" class="record">Test record for the benchmark's checks.</p></footer>
<script src="../bench.js"></script>
</body>
</html>
