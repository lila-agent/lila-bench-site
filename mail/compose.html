<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bench Mail · New message</title>
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="compose">
<div class="banner">Lila test site for benchmarking. Every name, address and number here is made up; nothing is sent or bought.</div>
<header><strong>Bench Mail</strong><a href="../mail/">Inbox</a><a href="../mail/drafts.html">Drafts</a><a href="../mail/sent.html">Sent</a><a href="../mail/compose.html">Compose</a></header>
<main>
<h1 id="heading">New message</h1>
<form class="card" id="compose" onsubmit="return false">
<label for="to">To</label><input id="to" name="to"><label for="subject">Subject</label><input id="subject" name="subject">
<label for="body">Message</label><textarea id="body" name="body"></textarea>
<div><button type="button" id="send">Send</button><button type="button" class="plain" id="save">Save draft</button><a class="button plain" href="index.html">Discard</a> <span id="saved" class="muted"></span></div></form>
<div class="card muted" id="quoted"></div>
</main>
<footer><p id="bench-record" role="note" class="record">Test record for the benchmark's checks.</p></footer>

</body>
